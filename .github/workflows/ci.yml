name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-and-renderer:
    name: Docs links + renderer tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-renderer/package-lock.json

      - name: Check internal Markdown links
        run: bash scripts/check-links.sh

      - name: Install renderer dependencies
        working-directory: web-renderer
        run: npm ci

      - name: Run renderer unit tests
        working-directory: web-renderer
        run: npm test

  macos-build-test:
    name: macOS build + XCTest
    runs-on: macos-latest
    env:
      CI: true
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-renderer/package-lock.json

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build web renderer
        working-directory: web-renderer
        run: |
          npm ci
          npm run build

      - name: Generate Xcode project
        run: |
          rm -rf FluxMarkdown.xcodeproj
          FULL_V="$(cat .version)"
          BUILD="$(echo "$FULL_V" | cut -d'.' -f3)"
          MARKETING_VERSION="$FULL_V" CURRENT_PROJECT_VERSION="$BUILD" xcodegen generate --quiet

      - name: Run Swift tests (skip benchmarks)
        run: |
          xcodebuild test \
            -project FluxMarkdown.xcodeproj \
            -scheme Markdown \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:MarkdownTests/RenderBenchmarkTests \
            CODE_SIGNING_ALLOWED=NO

      # Produce a downloadable build on every run so the app can be tested
      # without a local Mac. The runner has no Developer ID certificate, so the
      # app is ad-hoc signed ("-"): it launches locally (after clearing the
      # quarantine flag) but is NOT notarized for distribution.
      - name: Build Release app (ad-hoc signed)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project FluxMarkdown.xcodeproj \
            -scheme Markdown \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""
          APP="build/DerivedData/Build/Products/Release/FluxMarkdown.app"
          test -d "$APP" || { echo "::error::FluxMarkdown.app not found at $APP"; exit 1; }
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package .app zip and .dmg
        run: |
          set -euo pipefail
          VERSION="$(cat .version)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p build/out
          # ditto preserves the bundle's internal symlinks (e.g. Sparkle.framework)
          # that a plain zip would mangle.
          ditto -c -k --keepParent "$APP_PATH" "build/out/FluxMarkdown-${VERSION}.app.zip"
          # Simple drag-to-install DMG via hdiutil — no create-dmg or signing deps.
          STAGING="$(mktemp -d)"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "FluxMarkdown" \
            -srcfolder "$STAGING" -ov -format UDZO \
            "build/out/FluxMarkdown-${VERSION}.dmg"
          rm -rf "$STAGING"
          ls -lh build/out

      - name: Upload app + DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxMarkdown-${{ env.VERSION }}
          path: |
            build/out/FluxMarkdown-${{ env.VERSION }}.app.zip
            build/out/FluxMarkdown-${{ env.VERSION }}.dmg
          if-no-files-found: error
          retention-days: 14
